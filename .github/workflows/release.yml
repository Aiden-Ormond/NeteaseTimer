name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送 v1.0.0 等标签时触发

# 授予创建 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest # 打包 exe 需要使用 windows 环境
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name NeteaseTimer main.py
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseTimer-exe
          path: dist/NeteaseTimer.exe

      # 使用现代 Action 创建 Release 并上传资源
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NeteaseTimer.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
